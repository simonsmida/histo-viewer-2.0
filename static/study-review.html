<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blinded patch review · HistoViewer</title>
  <link rel="stylesheet" href="/static/study.css">
</head>
<body>
  <main class="study-shell">
    <div class="review-layout">
      <section class="card patch-pane">
        <div class="patch-panel-title">Expert study</div>
        <details class="context-details" open>
          <summary>Broader tissue context</summary>
          <div class="context-options"><label><input id="showGuides" type="checkbox" checked> Show patch location</label></div>
          <figure class="context-figure">
            <img id="contextImage" alt="Broader tissue area with the assessed patch outlined in blue">
            <figcaption>Context · blue box marks the patch</figcaption>
          </figure>
        </details>
        <figure class="patch-focus">
          <div class="patch-question">Is pattern present?</div>
          <div class="patch-frame"><img id="patchImage" alt="Magnified view of the assessed patch"></div>
          <figcaption>Patch of interest</figcaption>
        </figure>
        <p class="patch-number" id="patchNumber"></p>
        <svg id="contextLinks" class="context-links" aria-hidden="true"></svg>
      </section>
      <aside class="card answer-pane">
        <div class="answer-progress" id="progressText">Loading…</div>
        <div class="pattern"><span>Pattern</span><strong id="pattern"></strong></div>
        <p class="answer-instruction">Choose one answer.</p>
        <div class="answers" id="answers">
          <button class="answer present" data-value="present"><span class="answer-title">Present</span><span class="answer-help">Clearly visible.</span></button>
          <button class="answer absent" data-value="absent"><span class="answer-title">Absent</span><span class="answer-help">Clearly not visible.</span></button>
          <button class="answer uncertain" data-value="uncertain"><span class="answer-title">Uncertain</span><span class="answer-help">Cannot decide.</span></button>
        </div>
        <p class="choice-reminder" id="choiceReminder">Answers save automatically.</p>
        <div class="navigation"><button class="btn" id="previous">Back</button><button class="btn btn-primary" id="next">Next</button></div>
        <div class="save-state" id="saveState" role="status"></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </aside>
    </div>
    <section class="card review-overview" aria-labelledby="reviewOverviewTitle">
      <div class="review-overview-head">
        <div>
          <h2 id="reviewOverviewTitle">Reviewed patches</h2>
          <p>All sampled patches and your assessments.</p>
        </div>
        <div class="overview-actions">
          <button class="btn" id="toggleReviewGrid" type="button" aria-expanded="true">Hide patches</button>
          <button class="btn btn-primary" id="viewResults" disabled>View results</button>
        </div>
      </div>
      <div class="review-grid" id="reviewGrid"></div>
    </section>
  </main>
  <script type="module" src="/static/study-review.js"></script>
</body>
</html>
