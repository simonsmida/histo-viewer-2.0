<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blinded patch review · HistoViewer</title>
  <link rel="stylesheet" href="/static/study.css">
</head>
<body>
  <main class="study-shell">
    <header class="study-header">
      <div><div class="brand">HistoViewer expert study</div><div class="step-title">Patch review</div></div>
      <div class="step" id="progressText">Loading…</div>
    </header>
    <div class="review-layout">
      <section class="card patch-pane">
        <details class="context-details" open>
          <summary>Show broader tissue context</summary>
          <figure class="context-figure">
            <img id="contextImage" alt="Broader tissue area with the assessed patch outlined in blue">
            <figcaption>Context · blue box marks the patch</figcaption>
          </figure>
        </details>
        <figure class="patch-focus">
          <div class="patch-frame"><img id="patchImage" alt="Magnified view of the assessed patch"></div>
          <figcaption>Patch of interest</figcaption>
        </figure>
        <p class="patch-number" id="patchNumber"></p>
        <svg id="contextLinks" class="context-links" aria-hidden="true"></svg>
      </section>
      <aside class="card answer-pane">
        <div class="eyebrow">Your assessment</div>
        <h1>Does this area contain the described pattern?</h1>
        <div class="pattern"><span>Look for</span><strong id="pattern"></strong></div>
        <p class="answer-instruction">Choose one answer, then save.</p>
        <div class="answers" id="answers">
          <button class="answer present" data-value="present"><span class="answer-title">Present</span><span class="answer-help">Clearly visible.</span></button>
          <button class="answer absent" data-value="absent"><span class="answer-title">Absent</span><span class="answer-help">Clearly not visible.</span></button>
          <button class="answer uncertain" data-value="uncertain"><span class="answer-title">Uncertain</span><span class="answer-help">Cannot decide.</span></button>
          <button class="answer cannot" data-value="cannot_assess"><span class="answer-title">Cannot assess</span><span class="answer-help">Not enough usable tissue.</span></button>
        </div>
        <p class="choice-reminder" id="choiceReminder">Select one answer to continue.</p>
        <div class="navigation"><button class="btn" id="previous">Back</button><button class="btn btn-primary" id="next" disabled>Save and next</button></div>
        <div class="save-state" id="saveState" role="status"></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </aside>
    </div>
  </main>
  <script type="module" src="/static/study-review.js"></script>
</body>
</html>
