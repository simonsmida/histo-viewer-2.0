<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blinded patch review · HistoViewer</title><link rel="stylesheet" href="/static/study.css"></head><body><main class="study-shell"><header class="study-header"><div class="brand">HistoViewer expert study</div><div class="step" id="progressText">Loading…</div></header><div class="review-layout"><section class="card patch-pane"><div class="validation-images"><figure><img id="contextImage" alt="Local tissue neighborhood with the evaluated patch outlined"><figcaption>Local tissue neighborhood</figcaption></figure><figure><img id="patchImage" alt="Evaluated tissue patch"><figcaption>Evaluated patch</figcaption></figure></div><p class="patch-number" id="patchNumber"></p></section><aside class="card answer-pane"><div class="eyebrow">Blinded validation</div><h1>Is the proposed pattern present?</h1><div class="pattern" id="pattern"></div><div class="answers" id="answers"><button class="answer" data-value="present">Present <span class="key">1</span></button><button class="answer" data-value="absent">Absent <span class="key">2</span></button><button class="answer" data-value="uncertain">Uncertain <span class="key">3</span></button><button class="answer" data-value="cannot_assess">Cannot assess <span class="key">4</span></button></div><div class="navigation"><button class="btn" id="previous">Previous</button><button class="btn btn-primary" id="next">Next</button></div><div class="save-state" id="saveState" role="status"></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></aside></div></main><script type="module" src="/static/study-review.js"></script></body></html>
